name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libopus-dev libasound2-dev libpulse-dev libjack-jackd2-dev g++

      - name: Cache rtaudio native object
        uses: actions/cache@v4
        with:
          path: internal/rtaudiowrapper/rtaudio_go.o
          key: rtaudio-linux-v2-${{ hashFiles('internal/rtaudiowrapper/lib/rtaudio_go.cpp', 'internal/rtaudiowrapper/build.go') }}

      - name: Compile rtaudio native library
        working-directory: internal/rtaudiowrapper
        run: go generate .

      - name: Build
        run: go build -o roundtable ./cmd

      - name: Package release
        run: |
          mkdir release
          cp roundtable release/
          cp cmd/config.yaml release/
          zip -j roundtable-${{ github.ref_name }}-linux.zip release/*

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create ${{ github.ref_name }}
          roundtable-${{ github.ref_name }}-linux.zip
          --title "${{ github.ref_name }}"
          --generate-notes

  release-windows:
    runs-on: windows-latest
    needs: release-linux
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-opus zip

      - name: Cache opus install
        id: cache-opus
        uses: actions/cache@v4
        with:
          path: C:\opus
          key: opus-windows-${{ hashFiles('internal/opus/build.go') }}

      - name: Install opus to C:\opus
        if: steps.cache-opus.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          mkdir -p /c/opus/include /c/opus/lib
          cp -r /mingw64/include/opus /c/opus/include/
          cp /mingw64/lib/libopus.a /c/opus/lib/

      - name: Cache rtaudio native object
        uses: actions/cache@v4
        with:
          path: internal/rtaudiowrapper/rtaudio_go.o
          key: rtaudio-windows-${{ hashFiles('internal/rtaudiowrapper/lib/rtaudio_go.cpp', 'internal/rtaudiowrapper/build.go') }}

      - name: Compile rtaudio native library
        working-directory: internal/rtaudiowrapper
        run: go generate .

      - name: Build
        run: go build -o roundtable.exe ./cmd

      - name: Package release
        shell: msys2 {0}
        run: |
          mkdir -p release
          cp roundtable.exe release/
          cp cmd/config.yaml release/
          cp /mingw64/bin/libwinpthread-1.dll release/
          zip -j roundtable-${{ github.ref_name }}-windows.zip release/*

      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} roundtable-${{ github.ref_name }}-windows.zip
